<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="RONI Planner — مخطط يومي وأسبوعي شخصي سريع وبسيط." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/roni-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="192x192" href="/roni-icon-192.png" />
    <title>RONI Planner</title>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js", { scope: "/", updateViaCache: "none" })
          .then(function (registration) { return registration.update(); })
          .catch(function (error) { console.warn("[PWA] Early service worker registration failed", error); });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
